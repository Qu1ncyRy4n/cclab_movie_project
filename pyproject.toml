[project]
name = "cclab-movie-project"
version = "0.1.0"
description = "CCLab movie project: analysis environment (eye tracking, behaviour, spikes)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "h5py",
    "mne",
    "neo",
    "ipykernel",
    "jupyterlab",
    "nbconvert",
]

[dependency-groups]
dev = ["ruff", "basedpyright"]

[tool.uv]
package = false  # an environment for scripts and notebooks, not an installable package

[tool.ruff]
line-length = 120
